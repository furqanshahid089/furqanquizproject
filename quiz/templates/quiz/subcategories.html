<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category.name }} Topics | Furqan Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: #f4f6ff; color: #20233a; font-family: Arial, sans-serif; }
        .top-navbar { background: linear-gradient(100deg, #111b4b, #3c31a8, #6d28d9); padding: 16px 0; }
        .brand-name { color: white; text-decoration: none; font-size: 1.35rem; font-weight: 700; }
        .topic-card { display: block; height: 100%; padding: 26px; color: #292659; text-decoration: none; background: white; border-radius: 18px; box-shadow: 0 10px 25px rgba(36, 32, 107, .10); transition: .2s ease; }
        .topic-card:hover { color: white; transform: translateY(-5px); background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    </style>
</head>
<body>
    <nav class="top-navbar">
        <div class="container d-flex align-items-center">
            <a class="brand-name" href="{% url 'home' %}">Furqan Quiz</a>
            <a class="btn btn-outline-light btn-sm ms-auto" href="{% url 'home' %}">All Categories</a>
        </div>
    </nav>
    <main class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">{{ category.name }} Topics</h1>
            <p class="text-muted">Choose one topic and attempt its separate MCQs.</p>
        </div>
        <div class="row g-4">
            {% for subcategory in subcategories %}
                <div class="col-md-4 col-sm-6">
                    <a class="topic-card" href="{% url 'subcategory_quiz' category.id subcategory.id %}">
                        <h4 class="fw-bold mb-2">{{ subcategory.name }}</h4>
                        <span>{{ subcategory.questions.count }} question{{ subcategory.questions.count|pluralize }}</span>
                    </a>
                </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>

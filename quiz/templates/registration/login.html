<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Furqan Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef0ff, #f8f4ff);
            color: #20233a;
        }

        .top-navbar {
            background: linear-gradient(100deg, #111b4b, #3c31a8, #6d28d9);
            padding: 16px 0;
            box-shadow: 0 4px 20px rgba(46, 41, 129, 0.22);
        }

        .brand-name {
            color: white;
            text-decoration: none;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .login-card {
            max-width: 450px;
            padding: 42px;
            margin: 75px auto;
            background: white;
            border-radius: 22px;
            box-shadow: 0 16px 35px rgba(36, 32, 107, 0.15);
        }

        .login-card h2 {
            color: #24206b;
            font-weight: 700;
        }

        .login-card input {
            width: 100%;
            padding: 11px 12px;
            margin-top: 6px;
            border: 1px solid #d9dbea;
            border-radius: 9px;
            outline: none;
        }

        .login-card input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .login-card label {
            font-weight: 600;
            color: #24206b;
        }

        .login-button {
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }

        .login-button:hover {
            color: white;
        }
    </style>
</head>

<body>

    <nav class="top-navbar">
        <div class="container">

            <a href="{% url 'home' %}" class="brand-name">
                Furqan Quiz
            </a>

        </div>
    </nav>

    <main class="container">

        <div class="login-card">

            <div class="text-center mb-4">

                <h2>Welcome Back</h2>

                <p class="text-muted mb-0">
                    Login to continue your quiz journey.
                </p>

            </div>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn login-button w-100 mt-3">
                    Login
                </button>

            </form>

            <hr class="my-4">

            <p class="text-center mb-0">
                Don't have an account?
                <a href="{% url 'signup' %}" class="text-decoration-none fw-semibold">
                    Create Account
                </a>
            </p>

        </div>

    </main>

</body>
</html>
